<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKIPPABEAT - Banddashboard</title>
  <style>
    :root {
      --bg: #111111;
      --card-bg: #1c1c1e;
      --yellow: #f4e61e;
      --yellow-hover: #d8ca13;
      --text: #ffffff;
      --muted: #aaaaaa;
      --green: #30d981;
      --red: #ff5364;
      --orange: #ff9f0a;
      --border: #2c2c2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 60px;
    }

    /* SKA CHECKER PATTERN */
    .checker-bar {
      height: 12px;
      background-color: #fff;
      background-image: 
        linear-gradient(45deg, #000 25%, transparent 25%), 
        linear-gradient(-45deg, #000 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #000 75%), 
        linear-gradient(-45deg, transparent 75%, #000 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }

    header {
      background: #000;
      border-bottom: 4px solid var(--yellow);
      text-align: center;
      padding: 24px 16px;
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--yellow);
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* LOGIN MODAL / CARD */
    .login-card {
      background: var(--card-bg);
      border: 2px solid var(--yellow);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      margin: 40px auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    /* USER BAR */
    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1c1e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
    }
    .user-info { font-weight: bold; color: var(--yellow); }

    /* CARDS */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .card h2 {
      margin-top: 0;
      color: var(--yellow);
      text-transform: uppercase;
      font-size: 1.25rem;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* FORMS & INPUTS */
    label {
      display: block;
